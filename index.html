<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | Interactive rating component</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Rating State Card -->
  <main class="rating-card" id="rating-state">
    <div class="icon-star">
      <img src="./images/icon-star.svg" alt="star icon">
    </div>
    
    <h2>How did we do?</h2>
    <p>Please let us know how we did with your support request. All feedback is appreciated to help us improve our offering!</p>

    <div class="rating-group">
      <button type="button" class="rating-btn">1</button>
      <button type="button" class="rating-btn">2</button>
      <button type="button" class="rating-btn">3</button>
      <button type="button" class="rating-btn">4</button>
      <button type="button" class="rating-btn">5</button>
    </div>

    <!-- Added ID and Class -->
    <button type="button" class="submit-btn" id="submit-btn">SUBMIT</button>
  </main>

  <!-- Thank You State Card -->
  <section class="rating-card thank-you-card hidden" id="thank-you-state">
    <img src="./images/illustration-thank-you.svg" alt="Thank you illustration" class="thank-you-img">
    
    <div class="selected-badge">
      You selected <span id="selected-rating">0</span> out of 5
    </div>

    <h2>Thank you!</h2>
    <p>We appreciate you taking the time to give a rating. If you ever need more support, don’t hesitate to get in touch!</p>
  </section>

  <script src="script.js"></script>
</body>
</html>
